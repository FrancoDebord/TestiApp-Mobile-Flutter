name: testi_app
description: "Témoignages — plateforme de partage de témoignages chrétiens."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Icons ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── State management ───────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1

  # ── Network ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1

  # ── Local storage (SQLite) ─────────────────────────────────────────────────
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1

  # ── Firebase (Auth + FCM) ──────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # ── Push notifications locales ────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── UI helpers ─────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # ── Media ──────────────────────────────────────────────────────────────────
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  audio_waveforms: ^2.0.2
  video_player: ^2.9.1
  chewie: ^1.8.5
  image_picker: ^1.1.2
  file_picker: '>=11.0.2 <13.0.0'
  camera: ^0.12.0+1

  # ── Voice search ───────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0

  # ── Text-to-speech (lecture audio Bible) ──────────────────────────────────
  flutter_tts: ^4.0.0

  # ── Utils ──────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.1
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
