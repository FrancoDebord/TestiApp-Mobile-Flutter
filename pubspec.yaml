name: testi_app
description: "My Testimony — plateforme de partage de témoignages chrétiens."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Icons ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── State management ───────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1

  # ── Network ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1

  # ── Local storage (SQLite) ─────────────────────────────────────────────────
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1

  # ── Firebase (Auth + FCM) ──────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.2.0
  # Connexion Facebook désactivée (retirée de l'application) :
  # flutter_facebook_auth: ^7.1.1

  # ── Push notifications locales ────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  # Rappels de prière programmés (zonedSchedule)
  timezone: ^0.10.1

  # ── UI helpers ─────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # ── Media ──────────────────────────────────────────────────────────────────
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  audio_waveforms: ^2.0.2
  video_player: ^2.9.1
  chewie: ^1.8.5
  image_picker: ^1.1.2
  file_picker: '>=11.0.2 <13.0.0'
  camera: ^0.12.0+1

  # ── Voice search ───────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0

  # ── Text-to-speech (lecture audio Bible) ──────────────────────────────────
  flutter_tts: ^4.0.0

  # ── Cartes OpenStreetMap et position (lieu des événements) ─────────────────
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # ── Utils ──────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.1
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.3
  sqflite_common_ffi_web: ^1.1.1
  livekit_client: ^2.13.0
  wakelock_plus: ^1.7.0
  # Horloge du temps de prière (accélérable dans les tests)
  clock: ^1.1.1
  youtube_player_iframe: ^6.0.2
  tusc: 4.0.0
  video_compress: 3.1.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Icône de l'application : `dart run flutter_launcher_icons` (configuration en bas de ce fichier).
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  # Traductions générées depuis lib/l10n/arb (l10n.yaml).
  generate: true

  # Charte ARISE & SHINE Krea : logo et police Plus Jakarta Sans (SIL OFL, assets/fonts/OFL.txt).
  assets:
    - assets/images/arise_shine_krea.png

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

    # Verset du jour (choix « Texte » du sélecteur de designs) : Regular + SemiBold seulement.
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600

# Icône de l'application : logo actuel de l'app (AppLogoPainter : rayons, soleil, croix,
# colline). Images assets/icon/ générées par : flutter test tool/generate_app_icon_test.dart
# puis : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: launcher_icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#184797"
